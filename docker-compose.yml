# VeldrixAI — Development Environment
# All services share backend/.env.dev
# Frontend reads frontend/.env.local
# Postgres data is persisted in a named volume between restarts.

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: veldrix-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veldrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veldrix_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-veldrix_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veldrix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veldrix-dev-net

  # ── Redis (for caching and sessions) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: veldrix-dev-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veldrix-dev-net

  # ── Auth Service — hot-reload via uvicorn --reload ───────────────────────────
  veldrix-auth:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
      target: development
    container_name: veldrix-dev-auth
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-veldrix}:${POSTGRES_PASSWORD:-veldrix_dev_password}@postgres:5432/${POSTGRES_DB:-veldrix_dev}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
    volumes:
      - ./backend/auth:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - veldrix-dev-net

  # ── Core Trust Engine — hot-reload ──────────────────────────────────────────
  veldrix-core:
    build:
      context: ./backend/core
      dockerfile: Dockerfile
      target: development
    container_name: veldrix-dev-core
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    environment:
      APP_ENV: development
      CIRCUIT_BREAKER_BACKEND: memory
      VELDRIX_AUTH_URL: http://veldrix-auth:8000
      REDIS_URL: redis://redis:6379/1
      VELDRIX_CORS_ORIGINS: "http://localhost:5000,http://localhost:3000"
    volumes:
      - ./backend/core:/app
    ports:
      - "8001:8001"
    depends_on:
      veldrix-auth:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - veldrix-dev-net

  # ── Connectors / Analytics — hot-reload ─────────────────────────────────────
  veldrix-connectors:
    build:
      context: ./backend/connectors
      dockerfile: Dockerfile
      target: development
    container_name: veldrix-dev-connectors
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-veldrix}:${POSTGRES_PASSWORD:-veldrix_dev_password}@postgres:5432/${POSTGRES_DB:-veldrix_dev}
      REDIS_URL: redis://redis:6379/2
      APP_ENV: development
    volumes:
      - ./backend/connectors:/app
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      veldrix-auth:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - veldrix-dev-net

  # ── Frontend — Next.js dev server ────────────────────────────────────────────
  veldrix-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: veldrix-dev-ui
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      VELDRIX_AUTH_API_URL: http://veldrix-auth:8000
      VELDRIX_CORE_API_URL: http://veldrix-core:8001
      VELDRIX_CONNECTORS_API_URL: http://veldrix-connectors:8002
      NEXT_PUBLIC_VELDRIX_CORE_URL: http://localhost:8001
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "5000:5000"
    depends_on:
      veldrix-auth:
        condition: service_healthy
      veldrix-core:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"
    networks:
      - veldrix-dev-net

volumes:
  postgres_dev_data:
    name: veldrix_postgres_dev_data

networks:
  veldrix-dev-net:
    name: veldrix-dev-network
    driver: bridge