<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}VeldrixAI{% endblock %}</title>
  <style>
    body, table, td { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0; mso-table-rspace:0; }
    img { border:0; outline:none; text-decoration:none; }
    @media only screen and (max-width:620px) {
      .card { width:100% !important; border-radius:0 !important; }
      .pad  { padding:32px 24px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f2f2f5;font-family:Arial,Helvetica,sans-serif;">

<!-- Preheader -->
<div style="display:none;max-height:0;overflow:hidden;font-size:1px;color:#f2f2f5;">
  {% block preheader %}VeldrixAI — Runtime Trust Infrastructure{% endblock %}
</div>

<!-- Page wrapper -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f2f2f5;">
  <tr>
    <td align="center" style="padding:48px 20px;">

      <!-- Card -->
      <table class="card" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
             style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;
                    border:1px solid #e4e4e9;overflow:hidden;">

        <!-- HEADER -->
        <tr>
          <td class="pad" style="padding:32px 40px 28px;border-bottom:1px solid #ebebef;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <!-- V logo box -->
                <td valign="middle" style="padding-right:12px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="width:40px;height:40px;background:linear-gradient(135deg,#7c3aed,#4f46e5);
                                 border-radius:10px;text-align:center;vertical-align:middle;">
                        <span style="font-family:Georgia,'Times New Roman',serif;font-size:22px;
                                     font-weight:700;color:#ffffff;letter-spacing:-1px;">V</span>
                      </td>
                      <!-- Cyan dot accent -->
                      <td style="vertical-align:top;padding-left:2px;padding-top:6px;">
                        <div style="width:7px;height:7px;background:#06b6d4;border-radius:50%;"></div>
                      </td>
                    </tr>
                  </table>
                </td>
                <!-- Wordmark -->
                <td valign="middle">
                  <div style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;
                               color:#1a1a2e;letter-spacing:-0.3px;line-height:1;">VeldrixAI</div>
                  <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#9090a8;
                               letter-spacing:2px;text-transform:uppercase;margin-top:3px;">
                    Runtime Trust Infrastructure
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Purple accent bar -->
        <tr>
          <td style="height:3px;background:linear-gradient(90deg,#7c3aed,#4f46e5,#06b6d4);
                     padding:0;font-size:0;line-height:0;">&nbsp;</td>
        </tr>

        <!-- BODY -->
        <tr>
          <td class="pad" style="padding:40px 40px 36px;">
            {% block content %}{% endblock %}
          </td>
        </tr>

        <!-- CTA -->
        {% block cta_section %}{% endblock %}

        <!-- FOOTER -->
        <tr>
          <td style="padding:24px 40px;background:#f8f8fb;border-top:1px solid #ebebef;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center">
                  <p style="margin:0 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;
                             color:#9090a8;line-height:1.6;">
                    &copy; {{ current_year }} VeldrixAI Inc. &middot; All rights reserved
                  </p>
                  <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;
                             color:#b0b0c4;line-height:1.6;">
                    <a href="mailto:{{ support_email }}"
                       style="color:#7c3aed;text-decoration:none;">{{ support_email }}</a>
                    &nbsp;&middot;&nbsp;
                    <a href="{{ brand_url }}/privacy"
                       style="color:#b0b0c4;text-decoration:none;">Privacy Policy</a>
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
