# ══════════════════════════════════════════════════════════════════════════════
# VeldrixAI Core — Pillar Model Matrix (documentation)
#
# This file DOCUMENTS the per-pillar model matrix; the runtime source of truth
# is backend/core/src/config/pillar_models.py. Override any default with the
# canonical env pattern:
#
#   VELDRIX_PILLAR_MODEL__{SAFETY|HALLUCINATION|BIAS|PROMPT_SECURITY|COMPLIANCE}__{FIELD}
#   FIELD ∈ PRIMARY | FALLBACK | GROQ | TEMPERATURE | TOP_P | SEED | MAX_TOKENS | TIMEOUT_SECONDS
#
# Design principles:
#   - Five DISTINCT frontier models — one per pillar, matched to the evaluation task.
#   - Deterministic decoding on every call: temperature=0.0, top_p=1.0, pinned seed
#     (VELDRIX_INFERENCE_SEED, default 42).
#   - Provider-complete: each pillar also names its model on Groq failover, so a
#     provider switch never collapses the matrix onto one generic model.
#
# All NIM models are served via https://integrate.api.nvidia.com/v1
# Browse and test models at: https://build.nvidia.com/models
# ══════════════════════════════════════════════════════════════════════════════

pillars:

  # ── Pillar 1: Content Risk (SAFETY) ─────────────────────────────────────────
  safety_toxicity:
    primary: meta/llama-guard-4-12b
    fallback: meta/llama-guard-3-8b
    groq: meta-llama/llama-guard-4-12b
    rationale: >
      Purpose-built safety classifier with a fixed taxonomy and a deterministic
      safe/unsafe verdict format. A larger general model is strictly worse here —
      the guard model's constrained output is what keeps this pillar reproducible.

  # ── Pillar 2: Hallucination & Factual Integrity (HALLUCINATION) ─────────────
  hallucination:
    primary: nvidia/nemotron-3-ultra-550b-a55b
    fallback: nvidia/llama-3.1-nemotron-ultra-253b-v1
    groq: llama-3.3-70b-versatile
    rationale: >
      Factuality assessment is the hardest reasoning task in the matrix. Nemotron 3
      Ultra (550B MoE, 55B active, Mamba-Transformer hybrid, June 2026) is the
      strongest reasoning model on the NIM catalogue.

  # ── Pillar 3: Bias & Ethics (BIAS) ──────────────────────────────────────────
  bias_fairness:
    primary: mistralai/mistral-large-3-675b-instruct-2512
    fallback: mistralai/mistral-medium-3-5-128b
    groq: llama-3.3-70b-versatile
    rationale: >
      Bias judgement rewards breadth of perspective. Mistral Large 3 (675B MoE,
      41B active) is deliberately a different model family from the Nemotron
      pillars — family diversity reduces correlated blind spots across pillars.

  # ── Pillar 4: Policy Violation & Prompt Security (PROMPT_SECURITY) ──────────
  prompt_security:
    primary: nvidia/llama-3.1-nemotron-ultra-253b-v1
    fallback: nvidia/llama-3.3-nemotron-super-49b-v1.5
    groq: llama-3.3-70b-versatile
    rationale: >
      Evaluates responses against long in-context business policy rule sets;
      Nemotron Ultra 253B holds system-prompt constraints reliably at depth.

  # ── Pillar 5: Legal Exposure & Compliance (COMPLIANCE) ──────────────────────
  compliance_pii:
    primary: meta/llama-3.1-405b-instruct
    fallback: meta/llama-3.3-70b-instruct
    groq: llama-3.3-70b-versatile
    rationale: >
      Legal exposure needs corpus breadth (jurisdictions, regulation text);
      the 405B dense Llama has the widest stable knowledge coverage on NIM.

# ══════════════════════════════════════════════════════════════════════════════
# Reference — model size / typical NIM latency (indicative, July 2026)
#   meta/llama-guard-4-12b                        | 12B         | ~200 ms
#   nvidia/llama-3.3-nemotron-super-49b-v1.5      | 49B         | ~300 ms
#   meta/llama-3.3-70b-instruct                   | 70B         | ~400 ms
#   mistralai/mistral-medium-3-5-128b             | 128B (MoE)  | ~500 ms
#   nvidia/llama-3.1-nemotron-ultra-253b-v1       | 253B dense  | ~1.5 s
#   meta/llama-3.1-405b-instruct                  | 405B dense  | ~2.5 s
#   nvidia/nemotron-3-ultra-550b-a55b             | 550B (55B active) | ~1.5 s
#   mistralai/mistral-large-3-675b-instruct-2512  | 675B (41B active) | ~1.5 s
#
# Latency note: the heavyweight matrix trades the old sub-500 ms SLA for verdict
# quality; per-pillar TIMEOUT_SECONDS defaults (10–30 s) reflect that. Pin
# smaller PRIMARY models per pillar if your deployment needs the old latency.
# ══════════════════════════════════════════════════════════════════════════════
