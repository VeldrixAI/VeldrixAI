name: Frontend CI

on:
  push:
    branches: [main, "ft/**", "release/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build-lint-typecheck:
    name: Next.js build + lint + type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run type-check 2>/dev/null || npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: https://api.veldrixai.ca
          NEXT_PUBLIC_APP_URL: https://app.veldrixai.ca
          NEXT_PUBLIC_ENV: production
          NEXT_PUBLIC_VELDRIX_CORE_URL: https://api.veldrixai.ca
          VELDRIX_AUTH_API_URL: https://api.veldrixai.ca
          VELDRIX_CORE_API_URL: https://api.veldrixai.ca
          VELDRIX_CONNECTORS_API_URL: https://api.veldrixai.ca
          JWT_SECRET: ci-test-secret-not-for-production
        run: npm run build

      - name: Check for localhost in production bundle
        working-directory: frontend
        run: |
          if grep -r "localhost" .next/static/ 2>/dev/null | grep -v "node_modules"; then
            echo "FAIL: localhost reference found in production bundle"
            exit 1
          fi
          echo "OK: no localhost in production bundle"
