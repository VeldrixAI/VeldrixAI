name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests and deploy immediately (main only)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY:     ghcr.io
  IMAGE_PREFIX: ghcr.io/veldrixai/veldrixai
  IMAGE_TAG:    ${{ github.sha }}

jobs:

  # ── 1. Tests — run on every push and PR ──────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: SDK tests
        run: |
          pip install -e "sdk[dev]" --quiet
          pytest sdk/tests/ -v --tb=short -q

      - name: Backend core tests
        run: |
          pip install -r backend/core/requirements.txt pytest pytest-asyncio respx --quiet
          pytest backend/core/tests/ -v --tb=short -q -m "not integration"
        env:
          NVIDIA_API_KEY:  nim-mock-key-for-tests
          GROQ_API_KEY:    groq-mock-key-for-tests
          JWT_SECRET_KEY:  ci-test-secret
          APP_ENV:         test
          REDIS_URL:       redis://localhost:6379/0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm ci --prefer-offline --quiet
          npm audit --audit-level=high

      - name: Frontend build check
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE:         https://api.veldrixai.ca
          NEXT_PUBLIC_APP_URL:          https://app.veldrixai.ca
          NEXT_PUBLIC_ENV:              production
          NEXT_PUBLIC_VELDRIX_CORE_URL: https://api.veldrixai.ca
          VELDRIX_AUTH_API_URL:         https://api.veldrixai.ca
          VELDRIX_CORE_API_URL:         https://api.veldrixai.ca
          VELDRIX_CONNECTORS_API_URL:   https://api.veldrixai.ca
          JWT_SECRET:                   ci-test-secret

      - name: Auth email service tests
        run: |
          pip install -r backend/auth/requirements.txt pytest --quiet
          cd backend/auth && pytest tests/test_email_service.py -v --tb=short
        env:
          RESEND_API_KEY:         "re_test_placeholder"
          EMAIL_FROM:             "noreply@veldrixai.ca"
          EMAIL_FROM_NAME:        "VeldrixAI"
          EMAIL_SUPPORT_ADDRESS:  "rudramani031@veldrixai.ca"
          VELDRIX_UI_URL:         "https://app.veldrix.com"
          DATABASE_URL:           "postgresql://ci:ci@localhost/ci"
          JWT_SECRET_KEY:         "ci-test-secret"

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check sdk/veldrixai/
          ruff check backend/core/src/

  # ── 2. Build & push Docker images — main branch only ─────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name:       auth
            context:    backend/auth
            dockerfile: backend/auth/Dockerfile
          - name:       core
            context:    backend/core
            dockerfile: backend/core/Dockerfile
          - name:       connectors
            context:    backend/connectors
            dockerfile: backend/connectors/Dockerfile
          - name:       frontend
            context:    frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context:    ${{ matrix.service.context }}
          file:       ${{ matrix.service.dockerfile }}
          push:       true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service.name }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            NEXT_PUBLIC_API_BASE=https://api.veldrixai.ca
            NEXT_PUBLIC_APP_URL=https://app.veldrixai.ca
            NEXT_PUBLIC_ENV=production
            NEXT_PUBLIC_VELDRIX_CORE_URL=https://api.veldrixai.ca
            NEXT_PUBLIC_VELDRIX_CORE_API_URL=https://api.veldrixai.ca
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

  # ── 3. Deploy to production — main branch only ────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Deploy — update server and rolling restart
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} << 'ENDSSH'
            set -e
            cd /opt/veldrixai/repo

            echo "=== Syncing repo to origin/main ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Injecting secrets into .env ==="
            update_env() {
              local key="$1" val="$2"
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }
            update_env "GOOGLE_CLIENT_ID"     "${{ secrets.GOOGLE_CLIENT_ID }}"
            update_env "GOOGLE_CLIENT_SECRET" "${{ secrets.GOOGLE_CLIENT_SECRET }}"
            update_env "GITHUB_CLIENT_ID"     "${{ secrets.GH_CLIENT_ID }}"
            update_env "GITHUB_CLIENT_SECRET" "${{ secrets.GH_CLIENT_SECRET }}"
            update_env "RESEND_API_KEY"        "${{ secrets.RESEND_API_KEY }}"
            update_env "EMAIL_FROM"            "noreply@veldrixai.ca"
            update_env "EMAIL_FROM_NAME"       "VeldrixAI"
            update_env "EMAIL_SUPPORT_ADDRESS" "support@veldrixai.ca"

            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            export DOCKER_REGISTRY="${{ env.IMAGE_PREFIX }}"

            echo "=== Logging in to GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "=== Pulling images (tag: ${IMAGE_TAG}) ==="
            docker compose -f docker-compose.prod.yml pull

            echo "=== Rolling restart ==="
            # Tear down cleanly (volumes preserved), then bring everything up.
            # docker compose up may exit non-zero due to a 'No such container'
            # race when auth briefly crashes on first startup before postgres
            # accepts connections — that is a transient restart, not a real
            # failure. We ignore compose's exit code and use our own health
            # checks below as the authoritative gate.
            docker compose -f docker-compose.prod.yml down --timeout 30 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d 2>/dev/null || true

            echo "=== Waiting 60s for services to settle (including restart loops) ==="
            sleep 60

            echo "=== Health checks ==="
            # Services have no host port bindings — run curl inside each container.
            docker exec veldrix-auth curl -sf http://localhost:8000/health \
              && echo "  auth        ✓" || {
              echo "  auth        ✗ — last 50 log lines:"
              docker logs --tail 50 veldrix-auth 2>&1 || true
              exit 1
            }
            docker exec veldrix-core curl -sf http://localhost:8001/health \
              && echo "  core        ✓" || {
              echo "  core        ✗ — last 50 log lines:"
              docker logs --tail 50 veldrix-core 2>&1 || true
              exit 1
            }
            docker exec veldrix-connectors curl -sf http://localhost:8002/health \
              && echo "  connectors  ✓" || {
              echo "  connectors  ✗ — last 50 log lines:"
              docker logs --tail 50 veldrix-connectors 2>&1 || true
              exit 1
            }
            docker inspect --format='{{.State.Running}}' veldrix-ui 2>/dev/null \
              | grep -q true && echo "  frontend    ✓" || echo "  frontend    ✗ (non-blocking)"

            echo "=== Pruning old images ==="
            docker image prune -f

            echo "=== Deployment complete ==="
          ENDSSH

      - name: Notify success
        if: success()
        run: |
          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ *VeldrixAI deployed to production* | commit: \`${{ github.sha }}\` | by: ${{ github.actor }} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"🚨 *VeldrixAI production deploy FAILED* | commit: \`${{ github.sha }}\` | by: ${{ github.actor }} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true
