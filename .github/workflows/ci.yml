name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK deps
        run: cd sdk && pip install -e ".[dev]"
      - name: Run SDK tests
        run: cd sdk && pytest tests/ -v --tb=short

  test-backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: cd backend/core && pip install -r requirements.txt
      - name: Run backend tests
        run: cd backend/core && pytest tests/ -v --tb=short
        env:
          NVIDIA_API_KEY: ${{ secrets.NIM_API_KEY }}
          REDIS_URL: redis://localhost:6379/0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: cd sdk && ruff check veldrixai/ || true
      - run: cd backend/core && ruff check src/ || true

  
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-sdk, test-backend, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to DigitalOcean droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          timeout: 300s
          script: |
            cd /opt/veldrixai/repo
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans veldrix-auth
            sleep 10
            curl -sf http://localhost:8000/health || exit 1
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans veldrix-core
            sleep 10
            curl -sf http://localhost:8001/health || exit 1
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans veldrix-connectors
            sleep 10
            curl -sf http://localhost:8002/health || exit 1
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans veldrix-ui
            sleep 5
            echo "Deploy complete"
