name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests and deploy immediately"
        type:        boolean
        default:     false

concurrency:
  group:  production-deploy
  cancel-in-progress: false   # never cancel an in-flight deploy

env:
  REGISTRY:      ghcr.io
  IMAGE_PREFIX:  ghcr.io/veldrixai/veldrixai
  IMAGE_TAG:     ${{ github.sha }}

jobs:

  # ── 1. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: SDK tests
        run: |
          pip install -e "sdk[dev]" --quiet
          pytest sdk/tests/ -v --tb=short -q

      - name: Backend core tests
        run: |
          pip install -r backend/core/requirements.txt pytest pytest-asyncio respx --quiet
          pytest backend/core/tests/ -v --tb=short -q -m "not integration"
        env:
          NVIDIA_API_KEY:   nim-mock-key-for-tests
          GROQ_API_KEY:     groq-mock-key-for-tests
          JWT_SECRET_KEY:   ci-test-secret
          APP_ENV:          test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build check
        working-directory: frontend
        run: |
          npm ci --prefer-offline --quiet
          npm run build
        env:
          NEXT_PUBLIC_API_BASE:          https://api.veldrixai.ca
          NEXT_PUBLIC_APP_URL:           https://app.veldrixai.ca
          NEXT_PUBLIC_ENV:               production
          NEXT_PUBLIC_VELDRIX_CORE_URL:  https://api.veldrixai.ca
          VELDRIX_AUTH_API_URL:          https://api.veldrixai.ca
          VELDRIX_CORE_API_URL:          https://api.veldrixai.ca
          VELDRIX_CONNECTORS_API_URL:    https://api.veldrixai.ca
          JWT_SECRET:                    ci-test-secret

  # ── 2. Build and push Docker images ──────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name:       auth
            context:    backend/auth
            dockerfile: backend/auth/Dockerfile
          - name:       core
            context:    backend/core
            dockerfile: backend/core/Dockerfile
          - name:       connectors
            context:    backend/connectors
            dockerfile: backend/connectors/Dockerfile
          - name:       frontend
            context:    frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context:   ${{ matrix.service.context }}
          file:      ${{ matrix.service.dockerfile }}
          push:      true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service.name }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            NEXT_PUBLIC_API_BASE=https://api.veldrixai.ca
            NEXT_PUBLIC_APP_URL=https://app.veldrixai.ca
            NEXT_PUBLIC_ENV=production
            NEXT_PUBLIC_VELDRIX_CORE_URL=https://api.veldrixai.ca
            NEXT_PUBLIC_VELDRIX_CORE_API_URL=https://api.veldrixai.ca
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

  # ── 3. Deploy to production server ───────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    environment: production   # requires manual approval if configured in GitHub

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Copy config files to server
        run: |
          REMOTE="${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}"
          # Ensure gateway dirs exist inside the repo (where .env lives)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "$REMOTE" "mkdir -p /opt/veldrixai/repo/gateway/dynamic"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              docker-compose.prod.yml \
              "$REMOTE":/opt/veldrixai/repo/docker-compose.prod.yml
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              gateway/traefik.yml \
              "$REMOTE":/opt/veldrixai/repo/gateway/traefik.yml
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              gateway/dynamic/routes.yml \
              "$REMOTE":/opt/veldrixai/repo/gateway/dynamic/routes.yml

      - name: Deploy — pull images and rolling restart
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} << 'ENDSSH'
            set -e
            # Run from repo dir so docker compose picks up the existing .env file
            cd /opt/veldrixai/repo

            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            export DOCKER_REGISTRY="${{ env.IMAGE_PREFIX }}"

            echo "=== Logging in to GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "=== Pulling images (tag: ${IMAGE_TAG}) ==="
            docker compose -f docker-compose.prod.yml pull

            echo "=== Rolling restart ==="
            docker compose -f docker-compose.prod.yml up -d \
              --no-deps \
              --remove-orphans

            echo "=== Waiting 20s for services to settle ==="
            sleep 20

            echo "=== Health checks ==="
            curl -sf http://localhost:8000/health && echo "  auth        ✓" || (echo "  auth        ✗" && exit 1)
            curl -sf http://localhost:8001/health && echo "  core        ✓" || (echo "  core        ✗" && exit 1)
            curl -sf http://localhost:8002/health && echo "  connectors  ✓" || (echo "  connectors  ✗" && exit 1)
            curl -sf http://localhost:5000         && echo "  frontend    ✓" || echo "  frontend    ✗ (non-blocking)"

            echo "=== Pruning old images ==="
            docker image prune -f

            echo "=== Deployment complete ==="
          ENDSSH

      - name: Notify success
        if: success()
        run: |
          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ *VeldrixAI deployed to production* | commit: \`${{ github.sha }}\` | by: ${{ github.actor }} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"🚨 *VeldrixAI production deploy FAILED* | commit: \`${{ github.sha }}\` | by: ${{ github.actor }} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true
