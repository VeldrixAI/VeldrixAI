# Traefik STATIC config — LOCAL dev (self-signed mkcert TLS, no ACME).
#
# Identical to prod's gateway/traefik.yml and the parameterized
# infra/gateway/traefik.template.yml EXCEPT: there is NO certificatesResolvers /
# Let's Encrypt block — Let's Encrypt's HTTP-01 challenge needs public DNS that the
# local mirror does not have (RECON-LOCAL Finding 3). TLS is served from a mkcert
# cert mounted at /certs and referenced by the default store in dynamic/tls.yml.
#
# This is the self-signed parameterization of the same gateway: prod/cloud-dev use
# render-gateway.sh (LE / LE-staging); local uses these committed self-signed files.

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  traefik:
    address: ":8080"

# File-only provider (Docker label discovery intentionally disabled — same as prod).
# Watches the whole dynamic dir: routes.yml (router graph) + tls.yml (cert store).
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

# NOTE: no `certificatesResolvers` — local TLS is the self-signed default store
# (dynamic/tls.yml). Routers reference it with `tls: {}` instead of certResolver.

metrics:
  prometheus:
    entryPoint: traefik
    buckets: [0.1,0.3,1.2,5.0]

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        X-Request-ID: keep
        X-Forwarded-For: keep
        Authorization: redact

ping:
  entryPoint: traefik
