# Dynamic Routes for VeldrixAI
# Path-based routing to microservices (Google/OpenAI style)
#
# CRITICAL: All API routers MUST have Host(`api.veldrixai.ca`) constraint.
# Without it, Traefik intercepts requests to app.veldrixai.ca/api/... and
# routes them to backend services directly — bypassing Next.js API routes
# and stripping the auth cookie → "Could not validate credentials".

http:
  routers:
    # ── Auth Service Routes ───────────────────────────────────────────────────
    auth-router:
      rule: "Host(`api.veldrixai.ca`) && (PathPrefix(`/auth`) || PathPrefix(`/api-keys`) || PathPrefix(`/billing`) || PathPrefix(`/notifications`) || PathPrefix(`/users`))"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
        - cors
        - rate-limit
      service: auth-service
      tls:
        certResolver: letsencrypt
      priority: 10

    # ── Core Trust Engine Routes ──────────────────────────────────────────────
    core-router:
      rule: "Host(`api.veldrixai.ca`) && (PathPrefix(`/api/v1`) || PathPrefix(`/trust`) || PathPrefix(`/health`) || PathPrefix(`/evaluate`) || PathPrefix(`/pillars`) || PathPrefix(`/policy`) || PathPrefix(`/reports`) || PathPrefix(`/audit`) || PathPrefix(`/ws`))"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
        - cors
        - rate-limit
      service: core-service
      tls:
        certResolver: letsencrypt
      priority: 10

    # ── Connectors Routes (Analytics, Reports, Prompts) ───────────────────────
    connectors-router:
      rule: "Host(`api.veldrixai.ca`) && (PathPrefix(`/api/analytics`) || PathPrefix(`/api/reports`) || PathPrefix(`/api/prompts`) || PathPrefix(`/api/audit`) || PathPrefix(`/api/latency`) || PathPrefix(`/api/models`) || PathPrefix(`/api/metrics`) || PathPrefix(`/connectors`) || PathPrefix(`/api/connectors`) || PathPrefix(`/api/audit-trails`))"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
        - cors
        - rate-limit
      service: connectors-service
      tls:
        certResolver: letsencrypt
      priority: 10

    # ── Frontend Catch-All ────────────────────────────────────────────────────
    # Host-only rule — no PathPrefix needed. All app/www/root traffic goes here.
    frontend-router:
      rule: "Host(`app.veldrixai.ca`) || Host(`veldrixai.ca`) || Host(`www.veldrixai.ca`)"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
        - cors
      service: frontend-service
      tls:
        certResolver: letsencrypt
      priority: 1

  services:
    # Auth Service (port 8000)
    auth-service:
      loadBalancer:
        servers:
          - url: "http://veldrix-auth:8000"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s
        sticky:
          cookie:
            name: veldrix_auth_sticky
            secure: true
            httpOnly: true

    # Core Trust Engine (port 8001)
    core-service:
      loadBalancer:
        servers:
          - url: "http://veldrix-core:8001"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s
        responseForwarding:
          flushInterval: "100ms"

    # Connectors Service (port 8002)
    connectors-service:
      loadBalancer:
        servers:
          - url: "http://veldrix-connectors:8002"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    # Frontend (port 5000)
    frontend-service:
      loadBalancer:
        servers:
          - url: "http://veldrix-ui:5000"
        healthCheck:
          path: /
          interval: 60s
          timeout: 10s

  middlewares:
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000

    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m

    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - PATCH
        accessControlAllowOriginList:
          - "https://veldrixai.ca"
          - "https://www.veldrixai.ca"
          - "https://app.veldrixai.ca"
          - "https://api.veldrixai.ca"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-API-Key"
          - "X-Veldrix-Key"
          - "X-Requested-With"
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400
