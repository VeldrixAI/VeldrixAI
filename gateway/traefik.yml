# Traefik Static Configuration
# Google-level API Gateway for VeldrixAI

api:
  dashboard: true
  insecure: false

# Entry points - single public-facing port
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  traefik:
    address: ":8080"

# Providers - Docker and File-based routes
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: veldrix-network
    watch: true
  file:
    filename: /etc/traefik/dynamic/routes.yml
    watch: true

# Let's Encrypt auto-HTTPS (production)
certificatesResolvers:
  letsencrypt:
    acme:
      email: ${ACME_EMAIL:-admin@veldrixai.ca}
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# Metrics for Prometheus
metrics:
  prometheus:
    entryPoint: traefik
    buckets: [0.1,0.3,1.2,5.0]

# Access logs for observability
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        X-Request-ID: keep
        X-Forwarded-For: keep
        Authorization: redact

# Health check
ping:
  entryPoint: traefik

# Rate limiting middleware (applied globally)
http:
  middlewares:
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m
    
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customRequestHeaders:
          X-Content-Type-Options: nosniff
          X-Frame-Options: DENY
          X-XSS-Protection: 1; mode=block
    
    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - "https://veldrixai.ca"
          - "https://app.veldrixai.ca"
          - "http://localhost:5000"
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400