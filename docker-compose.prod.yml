# VeldrixAI — Production Environment
# Google-level architecture with API Gateway, observability, and auto-scaling
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Features:
#   - Traefik API Gateway (single entry point, path-based routing)
#   - Prometheus metrics collection
#   - Grafana dashboards
#   - Redis for caching and sessions
#   - Health checks on all services
#   - Non-root containers
#   - Auto-restart policies

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # API GATEWAY — Traefik (Single Entry Point)
  # ═══════════════════════════════════════════════════════════════════════════
  traefik:
    image: traefik:v3.2
    container_name: veldrix-gateway
    restart: unless-stopped
    # Ensure acme.json has 600 permissions before Traefik starts.
    # Traefik refuses to read/write the cert store if permissions are wrong,
    # causing it to fall back to a self-signed certificate (HTTPS broken).
    entrypoint:
      - "sh"
      - "-c"
      - "touch /letsencrypt/acme.json && chmod 600 /letsencrypt/acme.json && exec traefik --configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"       # HTTP (redirects to HTTPS)
      - "443:443"     # HTTPS
      - "8080:8080"   # Dashboard (internal only)
    volumes:
      - ./gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/dynamic:/etc/traefik/dynamic:ro
      - traefik-letsencrypt:/letsencrypt
      - traefik-logs:/var/log/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - veldrix-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=traefik"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  # ═══════════════════════════════════════════════════════════════════════════
  # CACHE & SESSION STORE — Redis
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: veldrix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - veldrix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # METRICS — Prometheus
  # ═══════════════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: veldrix-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - veldrix-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # DASHBOARDS — Grafana
  # ═══════════════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:11.3.1
    container_name: veldrix-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-veldrix2024}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.veldrixai.ca
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - veldrix-network
    depends_on:
      - prometheus
      - redis

  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE — PostgreSQL (Production Optimized)
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: veldrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veldrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-veldrix}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - veldrix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veldrix} -d ${POSTGRES_DB:-veldrix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ═══════════════════════════════════════════════════════════════════════════
  # AUTH SERVICE — Authentication, API Keys, Billing
  # ═══════════════════════════════════════════════════════════════════════════
  veldrix-auth:
    image: ${DOCKER_REGISTRY:-ghcr.io/veldrixai/veldrixai}-auth:${IMAGE_TAG:-latest}
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
      target: production
    container_name: veldrix-auth
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-veldrix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-veldrix}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-${JWT_SECRET:?JWT_SECRET_KEY (or JWT_SECRET) required}}
      - VELDRIX_VAULT_KEY=${VELDRIX_VAULT_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_GROW_MONTHLY=${STRIPE_PRICE_GROW_MONTHLY:-}
      - STRIPE_PRICE_GROW_ANNUAL=${STRIPE_PRICE_GROW_ANNUAL:-}
      - STRIPE_PRICE_SCALE_MONTHLY=${STRIPE_PRICE_SCALE_MONTHLY:-}
      - STRIPE_PRICE_SCALE_ANNUAL=${STRIPE_PRICE_SCALE_ANNUAL:-}
      - VELDRIX_UI_URL=${VELDRIX_UI_URL:-https://app.veldrixai.ca}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VELDRIX_CORS_ORIGINS=${CORS_ORIGINS:-https://veldrixai.ca,https://app.veldrixai.ca}
    networks:
      - veldrix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ═══════════════════════════════════════════════════════════════════════════
  # CORE SERVICE — Trust Evaluation Engine
  # ═══════════════════════════════════════════════════════════════════════════
  veldrix-core:
    image: ${DOCKER_REGISTRY:-ghcr.io/veldrixai/veldrixai}-core:${IMAGE_TAG:-latest}
    build:
      context: ./backend/core
      dockerfile: Dockerfile
      target: production
    container_name: veldrix-core
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-${JWT_SECRET:?JWT_SECRET_KEY required}}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - VELDRIX_AUTH_URL=http://veldrix-auth:8000
      - VELDRIX_CONNECTORS_URL=http://veldrix-connectors:8002
      - CONNECTORS_URL=http://veldrix-connectors:8002
      - REDIS_URL=redis://redis:6379/1
      - CIRCUIT_BREAKER_BACKEND=redis
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VELDRIX_CORS_ORIGINS=${CORS_ORIGINS:-https://veldrixai.ca,https://app.veldrixai.ca}
    networks:
      - veldrix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      veldrix-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ═══════════════════════════════════════════════════════════════════════════
  # CONNECTORS SERVICE — Analytics, Reports, Prompts
  # ═══════════════════════════════════════════════════════════════════════════
  veldrix-connectors:
    image: ${DOCKER_REGISTRY:-ghcr.io/veldrixai/veldrixai}-connectors:${IMAGE_TAG:-latest}
    build:
      context: ./backend/connectors
      dockerfile: Dockerfile
      target: production
    container_name: veldrix-connectors
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-veldrix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-veldrix}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-${JWT_SECRET:?JWT_SECRET_KEY required}}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - REDIS_URL=redis://redis:6379/2
      - CONNECTOR_ENCRYPTION_KEY=${CONNECTOR_ENCRYPTION_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@veldrixai.ca}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-VeldrixAI}
      - EMAIL_SUPPORT_ADDRESS=${EMAIL_SUPPORT_ADDRESS:-support@send.veldrixai.ca}
      - VELDRIX_UI_URL=${VELDRIX_UI_URL:-https://app.veldrixai.ca}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VELDRIX_CORS_ORIGINS=${CORS_ORIGINS:-https://veldrixai.ca,https://app.veldrixai.ca}
    networks:
      - veldrix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      veldrix-auth:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND — Next.js Application
  # ═══════════════════════════════════════════════════════════════════════════
  veldrix-ui:
    image: ${DOCKER_REGISTRY:-ghcr.io/veldrixai/veldrixai}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://api.veldrixai.ca}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.veldrixai.ca}
        NEXT_PUBLIC_ENV: production
        NEXT_PUBLIC_VELDRIX_CORE_URL: ${NEXT_PUBLIC_VELDRIX_CORE_URL:-https://api.veldrixai.ca}
        NEXT_PUBLIC_VELDRIX_CORE_API_URL: ${NEXT_PUBLIC_VELDRIX_CORE_API_URL:-https://api.veldrixai.ca}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    container_name: veldrix-ui
    restart: unless-stopped
    environment:
      - PORT=5000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_VELDRIX_CORE_API_URL=https://api.veldrixai.ca
      - NEXT_PUBLIC_VELDRIX_AUTH_URL=https://api.veldrixai.ca/auth
      - NEXT_PUBLIC_VELDRIX_CONNECTORS_URL=https://api.veldrixai.ca
      - VELDRIX_AUTH_API_URL=http://veldrix-auth:8000
      - VELDRIX_CORE_API_URL=http://veldrix-core:8001
      - VELDRIX_CONNECTORS_API_URL=http://veldrix-connectors:8002
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    networks:
      - veldrix-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      veldrix-auth:
        condition: service_healthy
      veldrix-core:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

# ═════════════════════════════════════════════════════════════════════════════
# NETWORKS — Isolated bridge network for inter-service communication
# ═════════════════════════════════════════════════════════════════════════════
networks:
  veldrix-network:
    driver: bridge
    name: veldrix-network

# ═════════════════════════════════════════════════════════════════════════════
# VOLUMES — Persistent storage
# ═════════════════════════════════════════════════════════════════════════════
volumes:
  postgres-data:
    name: veldrix-postgres-data
  redis-data:
    name: veldrix-redis-data
  prometheus-data:
    name: veldrix-prometheus-data
  grafana-data:
    name: veldrix-grafana-data
  traefik-letsencrypt:
    name: veldrix-traefik-letsencrypt
  traefik-logs:
    name: veldrix-traefik-logs